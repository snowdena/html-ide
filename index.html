<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website IDE</title>

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1f2933;
      color: #f9fafb;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .left,
    .right {
      min-height: 0;
      overflow-y: auto;
    }

    .left {
      flex: none;
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #d0d7de;
      min-width: 0;
      min-height: 0;
    }

    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #dragbar {
      width: 6px;
      background: #d0d7de;
      cursor: col-resize;
    }

    #dragbar:hover {
      background: #9ca3af;
    }

    .pane-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #f3f4f6;
      border-bottom: 1px solid #d0d7de;
      padding: 0.4rem 0.75rem;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .tabs {
      position: sticky;
      top: 32px;
      z-index: 20;
      display: flex;
      border-bottom: 1px solid #d0d7de;
      background: #f9fafb;
    }

    .tabs button {
      flex: 1;
      padding: 0.4rem 0.75rem;
      border: none;
      border-right: 1px solid #d0d7de;
      background: #e5e7eb;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tabs button:last-child {
      border-right: none;
    }

    .tabs button.active {
      background: #2563eb;
      color: #fff;
    }

    .editor-pane {
      flex: 1;
      width: 100%;
      height: 100%;
      display: none;
      min-height: 0;
      overflow-y: auto;
    }

    .editor-pane.active {
      display: block;
    }

    .CodeMirror {
      height: 100%;
      font-size: 0.9rem;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }

    .toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #f9fafb;
      border-top: 1px solid #d0d7de;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.75rem;
      z-index: 9999;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button.action {
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 4px;
      border: 1px solid #9ca3af;
      background: #e5e7eb;
      cursor: pointer;
    }

    button.action.primary {
      background: #2563eb;
      border-color: #1d4ed8;
      color: white;
    }

    #themeToggle {
      margin-left: 0.5rem;
      min-width: 2.5rem;
      text-align: center;
    }

    @media (max-width: 800px) {
      main {
        flex-direction: column;
      }

      .left {
        border-right: none;
        border-bottom: 1px solid #d0d7de;
        width: 100%;
      }

      #dragbar {
        display: none;
      }
    }

    textarea.editor-textarea {
      display: none;
    }

	:root {
	  --editor-font-size: 0.9rem;
	}
	.CodeMirror {
	  font-size: var(--editor-font-size);
	}

.dark-mode {
background: #1e1e1e;
color: #f3f4f6;
}



  </style>
</head>
<body>
  <header>
    <span>Website IDE >>> 
	  <button id="undoBtn" class="action">Undo</button>
	  <button id="redoBtn" class="action">Redo</button>
	  <button id="addPageBtn" class="action">Add page</button>
	  <button id="removePageBtn" class="action">Remove page</button>
	  <button id="resetPageBtn" class="action">Reset page</button>
	  <button id="resetAllBtn" class="action">Reset ALL pages</button>
	  <button id="toggleLivePreview" class="action">Live preview: OFF</button>
	  <button id="updatePreviewBtn" class="action">Update preview</button>
	  <button id="shareBtn" class="action primary">Update URL & copy</button>

	  <button id="fontUpBtn" class="action">A+</button>
	  <button id="fontDownBtn" class="action">A−</button>
	  <button id="themeToggle" class="action">🌞</button>
	</span>
  </header>

  <main>
    <section class="left">
      <div class="pane-header">Editors</div>
      <div class="tabs"></div>
      <div id="editorPanes"></div>
    </section>

    <div id="dragbar"></div>

    <section class="right">
      <div class="pane-header">Preview</div>
      <iframe id="preview" title="Website preview"></iframe>
    </section>
  </main>

  <script>
    const DEFAULT_CSS = `
/* Shared site-wide styles */
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 1rem;
}
.top-heading {
  background: #cce7ff;
  padding: 1.5rem;
  text-align: center;
}
.top-heading h1 {
  margin: 0;
  font-size: 2.5rem;
  color: #003366;
  font-weight: 700;
}
.site-nav {
  display: flex;
  justify-content: space-around;
  background: #cce7ff;
  padding: 0.75rem;
}
.site-nav a {
  color: #003366;
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
}
.site-nav a:hover {
  text-decoration: underline;
}
`;

    const DEFAULT_PAGES = {
      page1: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
</head>
<body>
  <div class="top-heading">
    <h1>My Big Page Heading</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>Home</h2>
  <p>Welcome to my basic multi‑page website.</p>
</body>
</html>`,
      page2: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About</title>
</head>
<body>
  <div class="top-heading">
    <h1>About This Site</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>About</h2>
  <p>Write about yourself or your project here.</p>
</body>
</html>`,
      page3: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Services</title>
</head>
<body>
  <div class="top-heading">
    <h1>What I Offer</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>Services</h2>
  <p>Describe what you offer.</p>
</body>
</html>`,
      page4: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery</title>
</head>
<body>
  <div class="top-heading">
    <h1>Gallery</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>Gallery</h2>
  <p>Add images or descriptions.</p>
</body>
</html>`,
      page5: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
</head>
<body>
  <div class="top-heading">
    <h1>Get in Touch</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>Contact</h2>
  <p>Provide contact details or a simple form.</p>
</body>
</html>`
    };

    const DEFAULT_NAVBAR = `
<nav class="site-nav">
  <a onclick="parent.loadPreviewPage('page1')">Home</a>
  <a onclick="parent.loadPreviewPage('page2')">About</a>
  <a onclick="parent.loadPreviewPage('page3')">Services</a>
  <a onclick="parent.loadPreviewPage('page4')">Gallery</a>
  <a onclick="parent.loadPreviewPage('page5')">Contact</a>
</nav>
`;

    let siteData = null;
    const cmEditors = {};
    let darkMode = false;
    let currentPreviewPage = 'page1';
    let livePreviewEnabled = false;
    let previewDebounceTimer = null;
    const preview = document.getElementById('preview');

    function copyToClipboard(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }

    function performShareCore() {
      const pages = getPagesFromEditors();
      const cssDoc = cmEditors.css ? cmEditors.css.getValue() : siteData.css;
      const navbarDoc = cmEditors.navbar ? cmEditors.navbar.getValue() : siteData.navbar;
      const payload = { pages, css: cssDoc, navbar: navbarDoc };
      const json = JSON.stringify(payload);
      const compressed = LZString.compressToEncodedURIComponent(json);
      const url = new URL(window.location.href);
      url.searchParams.set("site", compressed);
      const finalURL = url.toString();
      history.replaceState(null, "", finalURL);
      copyToClipboard(finalURL);
    }

    function debouncedPreviewUpdate() {
      clearTimeout(previewDebounceTimer);
      previewDebounceTimer = setTimeout(() => {
        updatePreview(currentPreviewPage);
      }, 300);
    }

    function createEditorIfNeeded(page) {
      if (cmEditors[page]) return;

      const textarea = document.getElementById('ta-' + page);
      const mode = page === 'css' ? 'css' : 'htmlmixed';

      cmEditors[page] = CodeMirror.fromTextArea(textarea, {
        mode: mode,
        lineNumbers: true,
        theme: darkMode ? 'material-darker' : 'default',
        tabSize: 2,
        indentUnit: 2,
        lineWrapping: true
      });

      if (page === 'css') {
        cmEditors.css.setValue(siteData.css);
      } else if (page === 'navbar') {
        cmEditors.navbar.setValue(siteData.navbar);
        cmEditors.navbar.on("change", () => {
          siteData.navbar = cmEditors.navbar.getValue();
          updateTabLabelsFromNavbar();
        });
      } else {
        cmEditors[page].setValue(siteData.pages[page]);
      }

      cmEditors[page].on("change", () => {
        if (livePreviewEnabled) {
          debouncedPreviewUpdate();
        }
      });
    }

    function getPagesFromEditors() {
      const result = {};
      Object.keys(siteData.pages).forEach(p => {
        if (cmEditors[p]) {
          result[p] = cmEditors[p].getValue();
        } else {
          result[p] = siteData.pages[p];
        }
      });
      return result;
    }

    function updatePreview(pageId) {
      const pages = getPagesFromEditors();
      let htmlDoc = pages[pageId];
      const cssText = cmEditors.css ? cmEditors.css.getValue() : siteData.css;
      const styleTag = `<style>${cssText}</style>`;
      htmlDoc = htmlDoc.replace('</head>', styleTag + '</head>');
      const navbarHtml = cmEditors.navbar ? cmEditors.navbar.getValue() : siteData.navbar;

      if (htmlDoc.includes('<div id="navbar-slot"></div>')) {
        htmlDoc = htmlDoc.replace('<div id="navbar-slot"></div>', navbarHtml);
      } else {
        htmlDoc = htmlDoc.replace('<body>', '<body>' + navbarHtml);
      }

      preview.srcdoc = htmlDoc;
      currentPreviewPage = pageId;
    }

    function loadPreviewPage(pageId) {
      updatePreview(pageId);
    }

    window.loadPreviewPage = loadPreviewPage;

    function getNavbarLabels(navbarHtml) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(navbarHtml, "text/html");
      const labels = {};
      doc.querySelectorAll("a").forEach(a => {
        const onclick = a.getAttribute("onclick");
        const match = onclick && onclick.match(/loadPreviewPage\('([^']+)'\)/);
        if (match) {
          const pageId = match[1];
          labels[pageId] = a.textContent.trim();
        }
      });
      return labels;
    }

    function updateTabLabelsFromNavbar() {
      const labels = getNavbarLabels(siteData.navbar);
      document.querySelectorAll('.tabs button').forEach(btn => {
        const pageId = btn.dataset.page;
        if (pageId === 'css') {
          btn.textContent = 'CSS';
        } else if (pageId === 'navbar') {
          btn.textContent = 'Navbar';
        } else {
          btn.textContent = labels[pageId] || pageId;
        }
      });
    }

    function rebuildPageTabs() {
      const tabs = document.querySelector('.tabs');
      const panesContainer = document.getElementById('editorPanes');

      tabs.innerHTML = '';

      const pageIds = Object.keys(siteData.pages);
      const labels = getNavbarLabels(siteData.navbar);

      pageIds.forEach(pageId => {
        const btn = document.createElement('button');
        btn.dataset.page = pageId;
        btn.textContent = labels[pageId] || pageId;
        if (pageId === currentPreviewPage) btn.classList.add('active');
        tabs.appendChild(btn);

        let pane = document.getElementById('pane-' + pageId);
        if (!pane) {
          pane = document.createElement('div');
          pane.id = 'pane-' + pageId;
          pane.classList.add('editor-pane');

          const ta = document.createElement('textarea');
          ta.id = 'ta-' + pageId;
          ta.className = 'editor-textarea';
          pane.appendChild(ta);

          panesContainer.appendChild(pane);
        }
        pane.classList.toggle('active', pageId === currentPreviewPage);

        btn.addEventListener('click', () => {
          currentPreviewPage = pageId;
          document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
          pane.classList.add('active');
          createEditorIfNeeded(pageId);
          cmEditors[pageId].refresh();
          updatePreview(pageId);
        });
      });

      let cssPane = document.getElementById('pane-css');
      if (!cssPane) {
        cssPane = document.createElement('div');
        cssPane.id = 'pane-css';
        cssPane.classList.add('editor-pane');
        const cssTa = document.createElement('textarea');
        cssTa.id = 'ta-css';
        cssTa.className = 'editor-textarea';
        cssPane.appendChild(cssTa);
        panesContainer.appendChild(cssPane);
      }

      let navbarPane = document.getElementById('pane-navbar');
      if (!navbarPane) {
        navbarPane = document.createElement('div');
        navbarPane.id = 'pane-navbar';
        navbarPane.classList.add('editor-pane');
        const navbarTa = document.createElement('textarea');
        navbarTa.id = 'ta-navbar';
        navbarTa.className = 'editor-textarea';
        navbarPane.appendChild(navbarTa);
        panesContainer.appendChild(navbarPane);
      }

      const cssTab = document.createElement('button');
      cssTab.dataset.page = 'css';
      cssTab.textContent = 'CSS';
      tabs.appendChild(cssTab);

      const navbarTab = document.createElement('button');
      navbarTab.dataset.page = 'navbar';
      navbarTab.textContent = 'Navbar';
      tabs.appendChild(navbarTab);

      cssTab.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        cssTab.classList.add('active');
        document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
        cssPane.classList.add('active');
        createEditorIfNeeded('css');
        cmEditors.css.refresh();
      });

      navbarTab.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        navbarTab.classList.add('active');
        document.querySelectorAll('.editor-pane').forEach(p => p.classList.remove('active'));
        navbarPane.classList.add('active');
        createEditorIfNeeded('navbar');
        cmEditors.navbar.refresh();
      });

      updateTabLabelsFromNavbar();
    }

    function loadFromQuery() {
      const url = new URL(window.location.href);
      const siteParam = url.searchParams.get('site');

      if (siteParam) {
        try {
          const decompressed = LZString.decompressFromEncodedURIComponent(siteParam);
          const json = decompressed || decodeURIComponent(siteParam);
          const payload = JSON.parse(json);
          siteData = {
            pages: payload.pages || DEFAULT_PAGES,
            css: payload.css || DEFAULT_CSS,
            navbar: payload.navbar || DEFAULT_NAVBAR
          };
        } catch (e) {
          console.error("Failed to load compressed site data:", e);
          siteData = {
            pages: DEFAULT_PAGES,
            css: DEFAULT_CSS,
            navbar: DEFAULT_NAVBAR
          };
        }
      } else {
        siteData = {
          pages: DEFAULT_PAGES,
          css: DEFAULT_CSS,
          navbar: DEFAULT_NAVBAR
        };
      }

      currentPreviewPage = 'page1';
      rebuildPageTabs();

      createEditorIfNeeded('page1');
      createEditorIfNeeded('css');
      createEditorIfNeeded('navbar');

      cmEditors.page1.refresh();
      cmEditors.css.refresh();
      cmEditors.navbar.refresh();

      updatePreview('page1');
    }

    const themeToggleBtn = document.getElementById('themeToggle');

    function toggleTheme() {
      darkMode = !darkMode;
	  document.body.classList.toggle("dark-mode", darkMode);
      const themeName = darkMode ? 'material-darker' : 'default';
      themeToggleBtn.textContent = darkMode ? '🌙' : '🌞';
      Object.values(cmEditors).forEach(ed => ed.setOption('theme', themeName));
    }

    document.getElementById('updatePreviewBtn').addEventListener('click', () => {
      updatePreview(currentPreviewPage);
    });

    document.getElementById('shareBtn').addEventListener('click', () => {
      performShareCore();
      alert("Shareable URL updated and copied to clipboard.");
    });

    document.getElementById('toggleLivePreview').addEventListener('click', () => {
      livePreviewEnabled = !livePreviewEnabled;
      document.getElementById('toggleLivePreview').textContent =
        livePreviewEnabled ? "Live preview: ON" : "Live preview: OFF";
      if (livePreviewEnabled) {
        debouncedPreviewUpdate();
      }
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
      const ed = cmEditors[currentPreviewPage] || cmEditors.css || cmEditors.navbar;
      if (ed) ed.undo();
    });

    document.getElementById('redoBtn').addEventListener('click', () => {
      const ed = cmEditors[currentPreviewPage] || cmEditors.css || cmEditors.navbar;
      if (ed) ed.redo();
    });

    document.getElementById('resetPageBtn').addEventListener('click', () => {
      const page = currentPreviewPage;
      if (page === 'css') {
        siteData.css = DEFAULT_CSS;
        if (cmEditors.css) cmEditors.css.setValue(DEFAULT_CSS);
      } else if (page === 'navbar') {
        siteData.navbar = DEFAULT_NAVBAR;
        if (cmEditors.navbar) cmEditors.navbar.setValue(DEFAULT_NAVBAR);
        updateTabLabelsFromNavbar();
      } else {
        siteData.pages[page] = DEFAULT_PAGES[page] || '';
        if (cmEditors[page]) cmEditors[page].setValue(siteData.pages[page]);
      }
      updatePreview(page);
    });

    document.getElementById('resetAllBtn').addEventListener('click', () => {
      siteData.pages = JSON.parse(JSON.stringify(DEFAULT_PAGES));
      siteData.css = DEFAULT_CSS;
      siteData.navbar = DEFAULT_NAVBAR;

      Object.keys(cmEditors).forEach(key => {
        if (key === 'css') {
          cmEditors.css.setValue(DEFAULT_CSS);
        } else if (key === 'navbar') {
          cmEditors.navbar.setValue(DEFAULT_NAVBAR);
        } else if (DEFAULT_PAGES[key]) {
          cmEditors[key].setValue(DEFAULT_PAGES[key]);
        }
      });

      const url = new URL(window.location.href);
      url.searchParams.delete("site");
      history.replaceState(null, "", url.toString());

      currentPreviewPage = 'page1';
      rebuildPageTabs();

      createEditorIfNeeded('page1');
      createEditorIfNeeded('css');
      createEditorIfNeeded('navbar');

      cmEditors.page1.refresh();
      cmEditors.css.refresh();
      cmEditors.navbar.refresh();

      updatePreview('page1');
      alert("All pages, CSS, and navbar reset; URL cleared.");
    });

    document.getElementById('addPageBtn').addEventListener('click', () => {
      const nums = Object.keys(siteData.pages)
        .map(p => parseInt(p.replace("page", ""), 10))
        .filter(n => !isNaN(n));
      const nextNum = nums.length ? Math.max(...nums) + 1 : 1;
      const newPageId = "page" + nextNum;

      siteData.pages[newPageId] = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>${newPageId}</title>
</head>
<body>
  <div class="top-heading">
    <h1>${newPageId}</h1>
  </div>
  <div id="navbar-slot"></div>
  <h2>${newPageId}</h2>
  <p>New page created.</p>
</body>
</html>`;

      currentPreviewPage = newPageId;
      rebuildPageTabs();

      createEditorIfNeeded(newPageId);
      cmEditors[newPageId].refresh();
      updatePreview(newPageId);
    });

    document.getElementById('removePageBtn').addEventListener('click', () => {
      const page = currentPreviewPage;
      const pages = Object.keys(siteData.pages);

      if (pages.length <= 1) {
        alert("You must have at least one page.");
        return;
      }

      delete siteData.pages[page];
      if (cmEditors[page]) delete cmEditors[page];

      const remaining = Object.keys(siteData.pages);
      currentPreviewPage = remaining[0];

      rebuildPageTabs();
      createEditorIfNeeded(currentPreviewPage);
      cmEditors[currentPreviewPage].refresh();
      updatePreview(currentPreviewPage);
    });

    themeToggleBtn.addEventListener('click', toggleTheme);

    const leftPane = document.querySelector('.left');
    const dragbar = document.getElementById('dragbar');
    let isDragging = false;

    dragbar.addEventListener('pointerdown', (e) => {
      isDragging = true;
      document.body.style.cursor = 'col-resize';
      dragbar.setPointerCapture(e.pointerId);
    });

    document.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const newWidth = e.clientX;
      if (newWidth < 200) return;
      if (newWidth > window.innerWidth - 200) return;
      leftPane.style.width = newWidth + 'px';
    });

    document.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      document.body.style.cursor = 'default';
      try {
        dragbar.releasePointerCapture(e.pointerId);
      } catch {}
    });

let editorFontSize = 0.9; // rem

function applyEditorFontSize() {
  document.documentElement.style.setProperty('--editor-font-size', editorFontSize + 'rem');
  Object.values(cmEditors).forEach(ed => ed.refresh());
}

document.getElementById('fontUpBtn').addEventListener('click', () => {
  editorFontSize = Math.min(editorFontSize + 0.1, 2.0);
  applyEditorFontSize();
});

document.getElementById('fontDownBtn').addEventListener('click', () => {
  editorFontSize = Math.max(editorFontSize - 0.1, 0.5);
  applyEditorFontSize();
});


    loadFromQuery();
  </script>
</body>
</html>
